apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: minoo25/todo-api:85dc56702f56af792044b4e8d7c656d1e8f6d93d
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Valeurs mesurees (Phase 12) : usage reel au repos ~17-19Mi,
            # OOMKilled confirme et reproductible a 16-20Mi sous charge.
            # 32Mi/64Mi valide sans aucune requete perdue sous charge.sh.
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: todo
spec:
  type: ClusterIP
  selector:
    app: todo-api
  ports:
    - port: 80
      targetPort: 3000
