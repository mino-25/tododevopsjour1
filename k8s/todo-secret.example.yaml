# Modèle du Secret todo-secret. Ne JAMAIS committer la version réelle avec
# des valeurs en clair. Pour la créer sur un cluster :
#
#   kubectl create secret generic todo-secret -n todo \
#     --from-literal=DB_USER=todo_user \
#     --from-literal=DB_PASSWORD=<mot_de_passe_fort> \
#     --from-literal=DB_NAME=todo_db
#
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  DB_USER: todo_user
  DB_PASSWORD: change_me
  DB_NAME: todo_db
