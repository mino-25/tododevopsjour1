<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container" class="flex-center">
        <h1>ClickFast</h1>
        <p class="catchphrase">Sois le plus rapide des clickers du game ⚡</p>

        <div class="flex-center">
          <div>
            <p>Score</p>
            <div id="score" class="number">0</div>
          </div>
          <div>
            <p>Temps restant</p>
            <div id="timer" class="number">5</div>
          </div>
        </div>

        <div class="flex-center">
          <button id="button-clicker">Click me!</button>
          <button id="button-reset">Reset</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
